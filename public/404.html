<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Mahim | mahims.com</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <script>
      // Known valid application routes
      var validRoutes = [
        '/',
        '/home',
        '/about',
        '/skills',
        '/experience',
        '/education',
        '/blog',
        '/contact',
        '/salami',
        '/wallet',
        '/admin'
      ];

      var rawPath = window.location.pathname.replace(/\/+$/, '') || '/';
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      // If the URL is an authentic app route (e.g. reload on /about or /skills), preserve it
      if (validRoutes.indexOf(rawPath) !== -1) {
        sessionStorage.setItem('spa_redirect', rawPath + search + hash);
        window.location.replace('/');
      } else {
        // Any 404 / broken / typo URL is immediately permanently redirected to the homepage
        window.location.replace('/' + (hash ? hash : ''));
      }
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/" />
    </noscript>
  </head>
  <body style="background-color: #0c0a09; color: #f59e0b; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <p style="font-size: 1.1rem; font-weight: 600;">হোমপেজে নিয়ে যাওয়া হচ্ছে...</p>
    </div>
  </body>
</html>
