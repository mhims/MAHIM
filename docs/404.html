<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="utf-8">
    <title>Mahim's World | রিডাইরেক্টিং...</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <script>
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        var cleanPath = path.replace(/\/+$/, '') || '/';
        var knownRoutes = ['/about', '/skills', '/experience', '/education', '/blog', '/contact', '/wallet', '/salami', '/chithi', '/classroom', '/portfolio'];
        
        if (knownRoutes.indexOf(cleanPath) !== -1) {
          sessionStorage.setItem('spa_redirect', cleanPath + search + hash);
          window.location.replace('/' + (search ? search : '') + (hash ? hash : ''));
        } else {
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body style="background:#09090b;color:#f3f4f6;display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,sans-serif;margin:0;">
    <div style="text-align:center;padding:20px;">
      <h2 style="color:#f59e0b;font-weight:700;margin-bottom:8px;">Mahim's World</h2>
      <p style="color:#a1a1aa;font-size:14px;">লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
    </div>
  </body>
</html>
