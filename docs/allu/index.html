<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Upload | Protected Drive - Mahim</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hind Siliguri", sans-serif;
      background-color: #0d0f12;
      color: #f4f4f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background-color: #161a20;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 { font-size: 22px; font-weight: 700; color: #ffffff; margin-bottom: 6px; }
    p { font-size: 13px; color: #a1a1aa; margin-bottom: 24px; line-height: 1.5; }
    label { display: block; font-size: 12px; color: #a1a1aa; margin-bottom: 8px; font-weight: 500; }
    input {
      width: 100%;
      padding: 12px 14px;
      background-color: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 10px;
      color: #ffffff;
      font-size: 18px;
      letter-spacing: 4px;
      font-family: monospace;
      outline: none;
      transition: all 0.2s;
    }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
    .error-msg { color: #f87171; font-size: 12px; margin-top: 8px; display: none; }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 18px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background-color: #3b82f6; }
    .footer-note {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #27272a;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #71717a;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #71717a;
      font-size: 12px;
      text-decoration: none;
    }
    .back-link:hover { color: #d4d4d8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">📤 ফাইল আপলোড ড্রাইভ (All Upload)</div>
    <h1>All Upload (/allu)</h1>
    <p>ফাইল আপলোড করতে পাসওয়ার্ড দিন। সঠিক হলে ড্রাইভ ফোল্ডার খুলে যাবে।</p>

    <form id="loginForm" onsubmit="handleVerify(event)">
      <label for="passInput">পাসওয়ার্ড লিখুন:</label>
      <input type="password" id="passInput" inputmode="numeric" placeholder="•••••" autofocus required autocomplete="off">
      <div id="errorMsg" class="error-msg">⚠️ ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।</div>
      <button type="submit">ড্রাইভে প্রবেশ করুন ➔</button>
    </form>

    <div class="footer-note">
      <span>🔒 ১০০% ব্যক্তিগত ও গোপন</span>
      <span>No-Index Protected</span>
    </div>
  </div>

  <script>
    const TARGET_URL = "https://drive.google.com/drive/folders/12p_mwStynD98DfgL5ruO37YD94ywz8ia?usp=sharing";
    const PASS = "197200";

    function handleVerify(e) {
      e.preventDefault();
      const input = document.getElementById('passInput');
      const errorMsg = document.getElementById('errorMsg');
      
      if (input.value.trim() === PASS) {
        errorMsg.style.display = 'none';
        window.location.replace(TARGET_URL);
      } else {
        errorMsg.style.display = 'block';
        input.value = '';
        input.focus();
      }
    }
  </script>
</body>
</html>
